<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <!-- Background -->
  <rect width="1000" height="1000" fill="#f5f5f5"/>
  
  <!-- Trousers -->
  <defs>
    <linearGradient id="trousersGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2d2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Waistband -->
  <ellipse cx="500" cy="280" rx="140" ry="50" fill="#1a1a1a"/>
  <rect x="360" y="280" width="280" height="30" fill="#1a1a1a"/>
  
  <!-- Belt loop indicators -->
  <rect x="380" y="280" width="12" height="100" fill="#111111" opacity="0.5"/>
  <rect x="608" y="280" width="12" height="100" fill="#111111" opacity="0.5"/>
  <rect x="460" y="280" width="12" height="50" fill="#111111" opacity="0.3"/>
  <rect x="528" y="280" width="12" height="50" fill="#111111" opacity="0.3"/>
  
  <!-- Left leg -->
  <path d="M 380 310 L 370 850 L 430 900 L 440 310 Z" fill="url(#trousersGradient)"/>
  
  <!-- Right leg -->
  <path d="M 560 310 L 550 900 L 630 850 L 620 310 Z" fill="url(#trousersGradient)"/>
  
  <!-- Zipper line left -->
  <line x1="410" y1="310" x2="400" y2="700" stroke="#555555" stroke-width="3" opacity="0.3"/>
  
  <!-- Zipper line right -->
  <line x1="590" y1="310" x2="580" y2="700" stroke="#555555" stroke-width="3" opacity="0.3"/>
  
  <!-- Pant creases for shape -->
  <path d="M 410 350 L 400 850" stroke="#000000" stroke-width="2" opacity="0.1"/>
  <path d="M 590 350 L 580 850" stroke="#000000" stroke-width="2" opacity="0.1"/>
  
  <!-- Bottom hem highlights -->
  <ellipse cx="405" cy="885" rx="25" ry="15" fill="#000000" opacity="0.15"/>
  <ellipse cx="585" cy="875" rx="25" ry="15" fill="#000000" opacity="0.15"/>
</svg>
