<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <!-- Background -->
  <rect width="1000" height="1000" fill="#f5f5f5"/>
  
  <!-- Polo Shirt -->
  <defs>
    <linearGradient id="poloGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003d5c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#002d42;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main body -->
  <path d="M 320 280 L 420 220 L 580 220 L 680 280 L 700 320 L 700 800 Q 500 850 300 800 L 300 320 Z" 
        fill="url(#poloGradient)"/>
  
  <!-- Polo collar -->
  <path d="M 420 220 L 460 300 L 500 310 L 460 260 Z" fill="#001f2d"/>
  <path d="M 580 220 L 540 300 L 500 310 L 540 260 Z" fill="#001f2d"/>
  
  <!-- Button placket (3 buttons typical for polo) -->
  <rect x="485" y="280" width="30" height="180" fill="#001f2d"/>
  
  <!-- Buttons -->
  <circle cx="500" cy="320" r="7" fill="#445566" opacity="0.7"/>
  <circle cx="500" cy="400" r="7" fill="#445566" opacity="0.7"/>
  <circle cx="500" cy="480" r="7" fill="#445566" opacity="0.7"/>
  
  <!-- Sleeve ribbing style -->
  <ellipse cx="220" cy="380" rx="85" ry="200" fill="#001f2d" opacity="0.9"/>
  <ellipse cx="780" cy="380" rx="85" ry="200" fill="#001f2d" opacity="0.9"/>
  
  <!-- Sleeve cuff ribbing detail -->
  <path d="M 200 650 Q 220 680 200 700" stroke="#000000" stroke-width="3" fill="none" opacity="0.15"/>
  <path d="M 800 650 Q 780 680 800 700" stroke="#000000" stroke-width="3" fill="none" opacity="0.15"/>
  
  <!-- Subtle body contour -->
  <path d="M 350 320 Q 360 500 350 800" stroke="#000000" stroke-width="2" fill="none" opacity="0.08"/>
  <path d="M 650 320 Q 640 500 650 800" stroke="#000000" stroke-width="2" fill="none" opacity="0.08"/>
  
  <!-- Chest area highlight -->
  <ellipse cx="500" cy="400" rx="80" ry="120" fill="#000000" opacity="0.04"/>
</svg>
