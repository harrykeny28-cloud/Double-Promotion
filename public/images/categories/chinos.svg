<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <!-- Background -->
  <rect width="1000" height="1000" fill="#f5f5f5"/>
  
  <!-- Chinos (khaki/tan colored) -->
  <defs>
    <linearGradient id="chinosGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9d8b6f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7a6f5e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Waistband -->
  <ellipse cx="500" cy="280" rx="140" ry="50" fill="#6b5f4f"/>
  <rect x="360" y="280" width="280" height="30" fill="#6b5f4f"/>
  
  <!-- Belt loops -->
  <rect x="380" y="280" width="14" height="120" fill="#5a5047" opacity="0.7"/>
  <rect x="606" y="280" width="14" height="120" fill="#5a5047" opacity="0.7"/>
  
  <!-- Left leg -->
  <path d="M 380 310 L 360 850 L 430 900 L 440 310 Z" fill="url(#chinosGradient)"/>
  
  <!-- Right leg -->
  <path d="M 560 310 L 550 900 L 630 850 L 620 310 Z" fill="url(#chinosGradient)"/>
  
  <!-- Front crease left -->
  <path d="M 410 320 L 395 850" stroke="#000000" stroke-width="3" opacity="0.12"/>
  
  <!-- Front crease right -->
  <path d="M 590 320 L 575 850" stroke="#000000" stroke-width="3" opacity="0.12"/>
  
  <!-- Subtle texture lines -->
  <path d="M 370 400 L 380 700" stroke="#000000" stroke-width="2" opacity="0.08"/>
  <path d="M 620 400 L 630 700" stroke="#000000" stroke-width="2" opacity="0.08"/>
  
  <!-- Button -->
  <circle cx="500" cy="295" r="12" fill="#5a5047"/>
  <circle cx="500" cy="295" r="8" fill="#7a6f5e" opacity="0.7"/>
  
  <!-- Zipper detail -->
  <line x1="500" y1="310" x2="500" y2="700" stroke="#8b7d6b" stroke-width="2" opacity="0.3"/>
</svg>
